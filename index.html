<style>
/* ============================================================
   QURAN MAAR v6.0 — design tokens
   Palette: black #0B0B0B ground, crimson red #8B0D1A accents,
   off-white #F5F2ED ink.
   Signature: arched (mihrab-doorway) card tops used throughout.
   ============================================================ */
:root{
  --bg:#0b0b0b;
  --bg-soft:#121010;
  --bg-raised:#181414;
  --ink:#f5f2ed;
  --muted:#a29c95;
  --muted-2:#706b66;
  --gold:#cf3342;
  --gold-rgb:207,51,66;
  --accent-rgb:179,32,47;
  --bg-rgb:11,11,11;
  --deep-rgb:74,11,20;
  --glow-rgb:179,32,47;
  --gold-hi:#f5f2ed;
  --gold-dim:rgba(var(--accent-rgb),.40);
  --emerald:#4a0b14;
  --emerald-hi:#8b0d1a;
  --line:rgba(245,242,237,.10);
  --line-soft:rgba(245,242,237,.06);
  --card:rgba(245,242,237,.035);
  --card-hi:rgba(245,242,237,.065);
  --danger:#ff8a94;
  --arabic-font:'Noto Naskh Arabic','Amiri',serif;
  --ease:cubic-bezier(.22,.68,.18,1);
  --shell-max:1180px;
  --nav-h:64px;
  --tab-h:64px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--gold-dim);color:var(--gold-hi);}
a{color:inherit;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(245,242,237,.14);border-radius:8px;}

.display{font-family:'Instrument Serif',serif;font-weight:400;}
.eyebrow{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:8px;font-weight:600;
}
.eyebrow::before{content:'';width:16px;height:1px;background:var(--gold);display:inline-block;}

/* ---------- background canvas (fixed, behind everything) ---------- */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-vignette{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(var(--glow-rgb),.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(var(--deep-rgb),.22), transparent 60%),
    linear-gradient(180deg, #08090b 0%, #0b0b0b 40%, #0b0b0b 100%);
}

#root{position:relative;z-index:1;min-height:100vh;}

/* ---------- shell / layout ---------- */
.shell{max-width:var(--shell-max);margin:0 auto;padding:0 20px;}
@media(min-width:900px){.shell{padding:0 40px;}}

/* ---------- nav (desktop) ---------- */
.nav{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px) saturate(140%);
  background:rgba(var(--bg-rgb),.72);
  border-bottom:1px solid var(--line-soft);
  height:var(--nav-h);
}
.nav-inner{max-width:var(--shell-max);margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;}
@media(min-width:900px){.nav-inner{padding:0 40px;}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;background:none;border:none;}
.brand-mark{
  width:34px;height:34px;border-radius:50% 50% 4px 4px;border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;
  background:linear-gradient(160deg, rgba(var(--accent-rgb),.14), transparent);
}
.brand-text{font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;letter-spacing:.01em;}
.brand-text b{font-style:normal;color:var(--gold);font-weight:400;}

.nav-pills{display:none;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;}
@media(min-width:820px){.nav-pills{display:flex;}}
.nav-pill{
  border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;
  cursor:pointer;transition:color .25s var(--ease),background .25s var(--ease);white-space:nowrap;
}
.nav-pill:hover{color:var(--ink);}
.nav-pill.active{background:var(--gold);color:#f5f2ed;}

.nav-actions{display:flex;align-items:center;gap:10px;}
.local-store-wrap{position:relative;}
.local-store-badge{
  display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px 7px 10px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;font-family:inherit;
}
.local-store-badge:hover{border-color:var(--gold-dim);background:var(--card-hi);}
.local-store-badge .ls-dot{width:7px;height:7px;border-radius:50%;background:#4fd17a;box-shadow:0 0 0 0 rgba(79,209,122,.5);animation:lsPulse 2.4s ease-out infinite;flex-shrink:0;}
.local-store-badge .ls-dot.warn{background:#e0b34f;}
@keyframes lsPulse{0%{box-shadow:0 0 0 0 rgba(79,209,122,.45);}70%{box-shadow:0 0 0 7px rgba(79,209,122,0);}100%{box-shadow:0 0 0 0 rgba(79,209,122,0);}}
@media(max-width:560px){.nav-actions .local-store-wrap{display:none;}}

.ls-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;width:min(340px,88vw);max-height:70vh;overflow-y:auto;
  background:var(--bg-raised);border:1px solid var(--line);border-radius:18px;padding:16px;z-index:80;
  box-shadow:0 24px 48px -20px rgba(0,0,0,.7);animation:sheetUp .25s var(--ease);
}
.mobile-menu-panel .ls-dropdown{position:static;width:100%;box-shadow:none;margin-bottom:8px;animation:none;}
.ls-header{margin-bottom:14px;}
.ls-header strong{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;margin-bottom:5px;font-weight:400;}
.ls-header small{display:block;font-size:11.5px;color:var(--muted);line-height:1.55;}
.ls-status{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:12px;}
.ls-status-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:11.5px;}
.ls-status-row:last-child{border-bottom:none;}
.ls-status-label{color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ls-status-label .ls-dot{width:6px;height:6px;animation:none;box-shadow:none;background:var(--muted-2);}
.ls-status-label .ls-dot.is-ok{background:#4fd17a;}
.ls-status-value{color:var(--ink);font-weight:600;text-align:right;}
.ls-toast{background:rgba(var(--accent-rgb),.12);border:1px solid var(--gold-dim);color:var(--gold-hi);border-radius:10px;padding:9px 12px;font-size:11.5px;margin-bottom:12px;}
.ls-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.ls-btn{
  background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:10px 8px;font-size:11.5px;
  font-weight:700;text-align:center;cursor:pointer;font-family:inherit;transition:border-color .2s,background .2s;
}
.ls-btn:hover{border-color:var(--gold-dim);background:var(--card-hi);}
.ls-btn:disabled{opacity:.5;cursor:default;}
.ls-btn-primary{background:var(--gold);color:#f5f2ed;border-color:var(--gold);}
.ls-backups-title{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.ls-backup-empty{font-size:11.5px;color:var(--muted);line-height:1.6;}
.ls-backup-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:11.5px;}
.ls-backup-item:last-child{border-bottom:none;}
.ls-backup-item span{color:var(--muted);font-variant-numeric:tabular-nums;}
.ls-backup-item button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.ls-backup-item button:disabled{opacity:.5;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .25s,transform .25s,background .25s;
  position:relative;
}
.icon-btn:hover{border-color:var(--gold-dim);background:var(--card-hi);}
.icon-btn:active{transform:scale(.92);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);}
.menu-btn{display:flex;}
@media(min-width:820px){.menu-btn{display:none;}}

/* mobile slide menu */
.mobile-menu{
  position:fixed;inset:0;z-index:60;background:rgba(8,9,10,.6);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.mobile-menu.open{opacity:1;pointer-events:auto;}
.mobile-menu-panel{
  position:absolute;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--bg-soft);
  border-left:1px solid var(--line);padding:22px 18px;transform:translateX(100%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column;gap:6px;
}
.mobile-menu.open .mobile-menu-panel{transform:translateX(0);}
.mobile-menu-item{
  display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;border:none;background:none;
  color:var(--muted);font-size:15px;font-weight:600;text-align:left;cursor:pointer;
}
.mobile-menu-item.active{background:var(--card-hi);color:var(--gold-hi);}

/* bottom tab bar (mobile) */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--tab-h);
  background:rgba(var(--bg-rgb),.86);backdrop-filter:blur(16px) saturate(140%);
  border-top:1px solid var(--line-soft);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:820px){.tab-bar{display:none;}}
.tab-item{
  background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10.5px;font-weight:600;cursor:pointer;letter-spacing:.01em;
}
.tab-item.active{color:var(--gold);}
.tab-item svg{width:20px;height:20px;}
body{padding-bottom:var(--tab-h);}
@media(min-width:820px){body{padding-bottom:0;}}

/* ---------- reveal / motion ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.page-enter{animation:pageIn .5s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes twinkle{0%,100%{opacity:.25;}50%{opacity:1;}}
@keyframes drift{0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}}
@keyframes shimmerGold{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1!important;transform:none!important;transition:none!important;}
  *{animation-duration:.001s!important;}
}


/* ---------- app download buttons + iPhone install sheet ---------- */
.hero-cta .btn{text-decoration:none;white-space:nowrap;}
@media(max-width:560px){
  .hero-cta{gap:10px;}
  .hero-cta .btn{flex:1 1 calc(50% - 5px);justify-content:center;padding:13px 14px;font-size:13.5px;min-width:0;}
  .hero-cta .btn-gold{flex-basis:100%;}
}
.app-modal{position:fixed;inset:0;z-index:1100;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(5,5,5,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:pageIn .3s var(--ease);overflow-y:auto;overscroll-behavior:contain;}
.app-modal-box{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg-raised);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:pageIn .35s var(--ease);}
@media(min-width:640px){.app-modal{align-items:center;padding:24px;}.app-modal-box{border-radius:26px;padding:32px 30px;}}
.app-modal-x{position:absolute;top:14px;right:14px;}
.app-modal h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:30px;line-height:1.15;margin:0 40px 10px 0;}
.app-modal .lead{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 0 20px;}
.app-modal .lead strong{color:var(--ink);}
.app-steps{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px;counter-reset:s;}
.app-steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55;}
.app-steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a3111f,var(--emerald-hi));color:#f5f2ed;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px;}
.app-steps b{color:var(--ink);}
.app-steps code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(245,242,237,.08);padding:2px 7px;border-radius:7px;word-break:break-all;}
.app-steps svg{vertical-align:-4px;margin:0 2px;}
.app-modal .note{font-size:12.5px;color:var(--muted-2);line-height:1.6;margin:0 0 18px;}
.app-modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
.app-modal-actions .btn{flex:1 1 180px;justify-content:center;text-decoration:none;}

/* ---------- hero ---------- */
.hero{position:relative;padding:64px 0 40px;min-height:min(86vh,760px);display:flex;flex-direction:column;justify-content:center;}
.hero-arch{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(560px,88vw);height:min(560px,88vw);
  border-radius:50% 50% 0 0 / 62% 62% 0 0;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg, rgba(var(--accent-rgb),.07), transparent 55%);
  pointer-events:none;
}
.hero-arch::before{
  content:'';position:absolute;inset:18px;border-radius:50% 50% 0 0 / 62% 62% 0 0;border:1px solid rgba(245,242,237,.06);
}
.hero-kicker{font-size:13px;color:var(--gold);letter-spacing:.05em;margin-bottom:18px;}
.hero h1{
  font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;
  font-size:clamp(44px,9vw,88px);line-height:.98;margin:0 0 20px;letter-spacing:-.01em;
}
.hero h1 em{
  font-style:italic;color:transparent;background-image:linear-gradient(100deg,var(--gold-hi),var(--gold),var(--gold-hi));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  animation:shimmerGold 7s linear infinite;
}
.hero-sub{max-width:520px;color:var(--muted);font-size:16px;line-height:1.65;margin-bottom:30px;}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:46px;}
.btn{
  border:none;cursor:pointer;font-weight:700;font-size:14px;padding:14px 24px;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);
}
.btn-gold{background:linear-gradient(135deg,#a3111f,var(--emerald-hi));color:#f5f2ed;box-shadow:0 10px 30px -12px rgba(var(--accent-rgb),.55);}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 34px -12px rgba(var(--accent-rgb),.65);}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--gold-dim);background:var(--card-hi);}
.btn:active{transform:scale(.97);}

.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:640px;}
.hero-stat{background:var(--bg-soft);padding:16px 14px;text-align:center;}
.hero-stat b{display:block;font-family:'Instrument Serif',serif;font-size:26px;color:var(--gold-hi);font-style:italic;}
.hero-stat span{font-size:11px;color:var(--muted);letter-spacing:.03em;}

/* ---------- section heads ---------- */
.section{padding:64px 0;}
.section.shell,.hero.shell,.footer.shell{padding-left:20px;padding-right:20px;}
@media(min-width:900px){.section.shell,.hero.shell,.footer.shell{padding-left:40px;padding-right:40px;}}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.section-head h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(28px,4vw,40px);margin:8px 0 0;}
.section-head p{color:var(--muted);font-size:14px;max-width:420px;margin:0;}

/* ---------- arch card (signature) ---------- */
.arch-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px 26px 14px 14px;
  padding:22px 18px 18px;transition:transform .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease);
  cursor:pointer;overflow:hidden;
}
.arch-card::before{
  content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:70%;height:44px;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;background:linear-gradient(180deg,rgba(var(--accent-rgb),.16),transparent);
  pointer-events:none;
}
.arch-card:hover{transform:translateY(-4px);border-color:var(--gold-dim);background:var(--card-hi);box-shadow:0 20px 40px -24px rgba(0,0,0,.6);}

/* ---------- surah grid ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;}
.search-box{
  flex:1 1 240px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:12px 18px;
}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14px;font-family:inherit;}
.search-box input::placeholder{color:var(--muted-2);}
.select-pill{
  background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:12px 16px;
  font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;outline:none;
}
.select-pill:hover{border-color:var(--gold-dim);}

.surah-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.surah-card{transition-delay:var(--d,0ms);}
.surah-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.surah-num{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--gold-dim);color:var(--gold-hi);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
}
.surah-badge{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--emerald-hi);background:rgba(139,13,26,.18);border:1px solid rgba(139,13,26,.4);padding:3px 8px;border-radius:999px;}
.surah-ar{font-family:var(--arabic-font);font-size:26px;color:var(--gold-hi);text-align:right;line-height:1.4;margin-bottom:6px;}
.surah-en{font-size:15px;font-weight:700;margin-bottom:2px;}
.surah-meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;}
.surah-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}

/* ---------- reciter grid ---------- */
.reciter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.reciter-card{
  text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;
  transition:border-color .25s,background .25s;
}
.reciter-card.active{border-color:var(--gold);background:rgba(var(--accent-rgb),.08);}
.reciter-card .r-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.reciter-card .r-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
.tag-pill{font-size:9px;letter-spacing:.05em;text-transform:uppercase;background:var(--gold);color:#f5f2ed;padding:2px 7px;border-radius:999px;font-weight:800;}

/* ---------- reader overlay ---------- */
.reader-overlay{position:fixed;inset:0;z-index:70;background:rgba(6,7,8,.72);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-end;}
@media(min-width:760px){.reader-overlay{align-items:center;padding:24px;}}
.reader-panel{
  width:100%;max-width:820px;max-height:92vh;background:var(--bg-soft);border:1px solid var(--line);
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;
  animation:sheetUp .4s var(--ease);
}
@media(min-width:760px){.reader-panel{border-radius:24px;}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.reader-head{padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.reader-head h3{margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;}
.reader-body{overflow-y:auto;padding:18px 20px 30px;flex:1;}
.bismillah-block{text-align:center;padding:22px 10px 26px;margin-bottom:8px;border-bottom:1px solid var(--line);}
.bismillah-ar{font-family:var(--arabic-font);font-size:30px;line-height:1.7;color:transparent;background-image:linear-gradient(100deg,var(--gold-hi),var(--gold),var(--gold-hi));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmerGold 7s linear infinite;margin-bottom:8px;}
.bismillah-en{font-size:12.5px;font-style:italic;color:var(--muted);}
.ayah-row{padding:18px 0;border-bottom:1px solid var(--line-soft);transition:background .3s var(--ease),box-shadow .3s var(--ease);}
.ayah-row.is-playing{background:linear-gradient(90deg,rgba(var(--accent-rgb),.08),transparent);box-shadow:inset 3px 0 0 var(--gold);padding-left:14px;margin-left:-14px;padding-right:14px;margin-right:-14px;border-radius:0 12px 12px 0;}
.ayah-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ayah-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(var(--accent-rgb),.14);border:1px solid var(--gold-dim);color:var(--gold-hi);font-size:11px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
.ayah-actions{display:flex;gap:6px;}
.mini-btn{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,background .2s;}
.mini-btn:hover{border-color:var(--gold-dim);}
.mini-btn.active{background:var(--gold);color:#f5f2ed;border-color:var(--gold);}
.ayah-ar{font-family:var(--arabic-font);font-size:28px;line-height:2.15;text-align:right;direction:rtl;color:var(--ink);margin-bottom:10px;}
.ayah-tr{font-size:14px;line-height:1.7;color:var(--muted);}
.reader-player{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;background:var(--bg-raised);}

/* ---------- reflection notes ---------- */
.note-panel{
  width:100%;max-width:520px;max-height:88vh;background:var(--bg-soft);border:1px solid var(--line);
  border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:sheetUp .35s var(--ease);
}
@media(min-width:760px){.note-panel{border-radius:24px;}}
.note-body{padding:20px;overflow-y:auto;}
.note-label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}
.note-textarea{
  width:100%;min-height:160px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;line-height:1.7;resize:vertical;outline:none;
}
.note-textarea:focus{border-color:var(--gold-dim);}
.note-textarea::placeholder{color:var(--muted-2);}
.note-savedstate{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px;}
.player-play{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#f5f2ed;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.player-info{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- hadith ---------- */
.hadith-card{margin-bottom:14px;}
.hadith-src{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.03em;margin-bottom:10px;padding-right:72px;}
.hadith-ar{font-family:var(--arabic-font);font-size:21px;line-height:2;text-align:right;direction:rtl;margin-bottom:10px;}
.hadith-en{font-size:14px;line-height:1.7;color:var(--muted);}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;}
.pager button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;}
.pager button:disabled{opacity:.35;cursor:not-allowed;}
.pager span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- prayer ---------- */
.prayer-hero{
  border-radius:26px 26px 14px 14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(var(--deep-rgb),.35),var(--card));
  padding:30px 24px;text-align:center;margin-bottom:24px;position:relative;overflow:hidden;
}
.prayer-hero .next-label{font-size:12px;color:var(--emerald-hi);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
.prayer-hero .next-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:44px;margin:8px 0;}
.prayer-hero .next-time{font-size:15px;color:var(--muted);}
.prayer-hero .countdown{font-variant-numeric:tabular-nums;font-size:13px;color:var(--gold-hi);margin-top:10px;letter-spacing:.02em;}
.prayer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.prayer-tile{text-align:center;padding:18px 10px;}
.prayer-tile .p-name{font-size:12px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;}
.prayer-tile .p-time{font-family:'Instrument Serif',serif;font-style:italic;font-size:24px;}
.prayer-tile.now{border-color:var(--gold);background:rgba(var(--accent-rgb),.08);}
.loc-pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--muted);margin-bottom:20px;}

/* ---------- moon ---------- */
.moon-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 20px;}
.moon-canvas-wrap{position:relative;width:190px;height:190px;margin-bottom:22px;animation:drift 6s ease-in-out infinite;}
.moon-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(198,161,91,.24),transparent 70%);filter:blur(6px);}
.moon-info b{font-family:'Instrument Serif',serif;font-style:italic;font-size:28px;display:block;margin-bottom:6px;}
.moon-info span{font-size:13.5px;color:#9b9587;}
.hijri-row{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap;justify-content:center;}
.hijri-box{text-align:center;}
.hijri-box b{font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;display:block;}
.hijri-box span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

/* ---------- qibla ---------- */
.qibla-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px;}
.compass{position:relative;width:250px;height:250px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,rgba(var(--accent-rgb),.08),transparent 70%);margin-bottom:20px;}
.compass-ring{position:absolute;inset:14px;border-radius:50%;border:1px dashed var(--line);}
.compass-n{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);letter-spacing:.05em;}
.compass-needle{position:absolute;left:50%;top:50%;width:2px;height:98px;transform-origin:bottom center;background:linear-gradient(180deg,var(--gold-hi),transparent);transition:transform .6s var(--ease);}
.compass-needle::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--gold-hi);}
.compass-center{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);}
.qibla-deg{font-family:'Instrument Serif',serif;font-style:italic;font-size:34px;margin-bottom:4px;}

/* ---------- bookmarks ---------- */
.bm-panel{position:fixed;inset:0;z-index:70;background:rgba(6,7,8,.72);backdrop-filter:blur(6px);}
.bm-drawer{position:absolute;right:0;top:0;bottom:0;width:min(380px,90vw);background:var(--bg-soft);border-left:1px solid var(--line);padding:20px;overflow-y:auto;animation:slideL .35s var(--ease);}
@keyframes slideL{from{transform:translateX(100%);}to{transform:translateX(0);}}
.bm-item{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;}
.bm-item .bm-top{display:flex;justify-content:space-between;font-size:12px;color:var(--gold);margin-bottom:6px;}
.bm-item .bm-text{font-family:var(--arabic-font);font-size:18px;text-align:right;direction:rtl;}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line-soft);padding:40px 0 30px;margin-top:30px;color:var(--muted);font-size:13px;}
.footer-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;}

/* ---------- home: compact prayer + moon widgets ---------- */
.home-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:860px){.home-grid{grid-template-columns:1.1fr 1fr;align-items:start;}}
.home-panel{position:relative;overflow:hidden;}
.home-panel .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}

.mini-prayer-ticker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.mini-prayer-pill{flex:1 1 80px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;}
.mini-prayer-pill.now{border-color:var(--gold);background:rgba(var(--accent-rgb),.1);}
.mini-prayer-pill .p-name{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.mini-prayer-pill .p-time{font-family:'Instrument Serif',serif;font-style:italic;font-size:16px;margin-top:3px;}
.home-clock-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
@media(min-width:480px){.home-clock-row{grid-template-columns:repeat(4,1fr);}}
.clock-box{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;}
.clock-box .c-val{font-family:'Instrument Serif',serif;font-style:italic;font-size:16px;font-variant-numeric:tabular-nums;}
.clock-box .c-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

/* moon stage — clouds, glow ring, floating canvas (v4-style) */
.moon-stage{position:relative;height:230px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(31,68,56,.28),transparent 65%);margin-bottom:14px;}
.moon-orbit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;}
.moon-glow-ring{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(198,161,91,.28),transparent 70%);filter:blur(4px);animation:pulseGlow 4s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
.moon-phase-container{position:relative;z-index:2;animation:drift 6s ease-in-out infinite;}
.moon-phase-container canvas{display:block;}
.cloud-layer{position:absolute;left:-20%;width:140%;height:56px;background:linear-gradient(90deg,transparent,rgba(244,239,228,.05),transparent);border-radius:50%;filter:blur(10px);z-index:3;pointer-events:none;}
.cloud-layer.c1{top:18%;animation:cloudDrift 22s linear infinite;}
.cloud-layer.c2{top:52%;height:42px;opacity:.7;animation:cloudDrift 32s linear infinite reverse;}
.cloud-layer.c3{top:74%;height:36px;opacity:.5;animation:cloudDrift 40s linear infinite;}
@keyframes cloudDrift{0%{transform:translateX(-10%);}100%{transform:translateX(10%);}}
.moon-readout{position:absolute;left:12px;bottom:10px;z-index:4;font-size:12px;color:#9b9587;background:rgba(10,11,13,.5);backdrop-filter:blur(4px);padding:6px 10px;border-radius:10px;}
.moon-readout b{color:#e9d4a3;font-weight:700;}
.moon-direction-callout{font-size:12.5px;color:#9b9587;text-align:center;line-height:1.6;}

/* ---------- qibla map (Leaflet) ---------- */
.qb-map-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);height:460px;margin-bottom:16px;}
@media(min-width:760px){.qb-map-wrap{height:560px;}}
.qb-map{width:100%;height:100%;background:#0d0f12;}
.qb-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(0.94) contrast(0.88) saturate(0.65);}
.qb-map .leaflet-control-attribution{background:rgba(var(--bg-rgb),.75)!important;color:var(--muted)!important;font-size:9px!important;}
.qb-map .leaflet-control-attribution a{color:var(--gold)!important;}
.qb-map .leaflet-control-zoom a{background:rgba(var(--bg-rgb),.85)!important;color:var(--ink)!important;border-color:var(--line)!important;}
.qb-kaaba-pin{font-size:20px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
.qb-user-pin{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 6px rgba(var(--accent-rgb),.22);}
.qb-info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
@media(min-width:640px){.qb-info-grid{grid-template-columns:repeat(4,1fr);}}
.qb-info-box{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;}
.qb-info-val{font-family:'Instrument Serif',serif;font-style:italic;font-size:18px;}
.qb-info-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px;}
.qb-search-wrap{margin-top:14px;position:relative;}
.qb-search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg-raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:5;max-height:220px;overflow-y:auto;}
.qb-search-result{padding:11px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
.qb-search-result:hover{background:var(--card-hi);}
.qb-search-result:last-child{border-bottom:none;}
.qb-facing-banner{background:linear-gradient(160deg,rgba(var(--deep-rgb),.3),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:center;font-size:14.5px;color:var(--muted);margin-bottom:14px;}
.qb-facing-banner b{color:var(--gold-hi);font-weight:700;}
.qb-note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.qb-wide-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:16px;padding:15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:border-color .25s,background .25s;margin-bottom:6px;
}
.qb-wide-btn:hover{border-color:var(--gold-dim);background:var(--card-hi);}

/* ---------- hadith bookmark star ---------- */
.hadith-bm-btn{position:absolute;top:16px;right:16px;}
.hadith-actions{position:absolute;top:16px;right:16px;display:flex;gap:6px;}
.center-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}

/* ---------- about ---------- */
.about-card{display:flex;flex-direction:column;gap:16px;margin-bottom:16px;cursor:default;}
@media(min-width:640px){.about-card{flex-direction:row;align-items:flex-start;}}
.about-avatar{width:96px;height:96px;border-radius:50% 50% 8px 8px;overflow:hidden;flex-shrink:0;border:1px solid var(--gold-dim);background:var(--card);}

/* ============================================================
   OFFLINE / PWA UI
   ============================================================ */
.net-banner{

  border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer;
}

.dl-btn{

  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}

.surah-card .surah-top{position:relative;}
.surah-dl{position:absolute;right:0;top:0;}

.offline-row{

}
.offline-row:last-child{border-bottom:none;}
.offline-row .o-main{flex:1;min-width:0;}
.offline-row .o-title{font-weight:700;font-size:15px;color:var(--ink);}
.offline-row .o-sub{font-size:12.5px;color:var(--muted-2);margin-top:3px;}

.storage-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--emerald-hi),var(--gold));}

@media (max-width:640px){

}

/* ---------- hero orb ---------- */
.hero>.reveal{position:relative;z-index:1;}
.hero-orb{position:absolute;right:1%;top:44%;width:min(440px,34vw);aspect-ratio:1;pointer-events:none;
  transform:translate(calc(var(--px,0)*-16px),calc(-50% + var(--py,0)*-12px));transition:transform .5s var(--ease);}
.orb-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(var(--gold-rgb),.22),rgba(var(--gold-rgb),.05) 60%,transparent 70%);animation:orbBreathe 6s ease-in-out infinite;}
.orb-ring.r1{width:100%;height:100%;opacity:.55}.orb-ring.r2{width:78%;height:78%;animation-delay:-2s;opacity:.7}.orb-ring.r3{width:56%;height:56%;animation-delay:-4s}
@keyframes orbBreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.orb-star{position:absolute;inset:0;width:100%;height:100%;color:rgba(245,242,237,.28);animation:orbSpin 90s linear infinite;}
.orb-star.s2{inset:9%;width:82%;height:82%;color:rgba(var(--gold-rgb),.5);animation-duration:70s;animation-direction:reverse;}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.orb-orbit{position:absolute;inset:3%;border-radius:50%;animation:orbSpin 26s linear infinite;}
.orb-orbit i{position:absolute;left:50%;top:-4px;width:8px;height:8px;border-radius:50%;background:#f5f2ed;box-shadow:0 0 14px 3px rgba(245,242,237,.7);}
.orb-moon{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 36% 30%,#fffaf7,#f7eceb 55%,#e6cdd0);
  box-shadow:0 0 40px 8px rgba(255,236,232,.5),0 0 120px 30px rgba(var(--gold-rgb),.45);}
.orb-moon .oc{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4b9c0,#d9778a);opacity:.9}
.oc.c1{left:56%;top:16%;width:17%;aspect-ratio:1}.oc.c2{left:64%;top:56%;width:10%;aspect-ratio:1}.oc.c3{left:18%;top:62%;width:9%;aspect-ratio:1}
@media (max-width:1060px){.hero-orb{display:none}}
@media (prefers-reduced-motion:reduce){.orb-ring,.orb-star,.orb-orbit{animation:none}}

/* ---------- live prayer ring ---------- */
.pr-card{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px 54px;padding:34px 30px;overflow:hidden;
  border:1px solid var(--line);border-radius:34px 34px 22px 22px;
  background:radial-gradient(90% 120% at 50% 110%,var(--s2),transparent 70%),linear-gradient(170deg,var(--s0),var(--s1));
  box-shadow:0 30px 70px -40px var(--glow);transition:box-shadow 1s var(--ease);}
.pr-card::before{content:'';position:absolute;left:50%;top:-40%;width:70%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 65%);opacity:.22;pointer-events:none;}
.pr-card.night::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(1.2px 1.2px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 28% 70%,#fff,transparent),radial-gradient(1.4px 1.4px at 46% 16%,#fff,transparent),
  radial-gradient(1px 1px at 63% 78%,#fff,transparent),radial-gradient(1.3px 1.3px at 80% 28%,#fff,transparent),radial-gradient(1px 1px at 91% 64%,#fff,transparent),radial-gradient(1px 1px at 6% 84%,#fff,transparent);
  animation:prTwinkle 5s ease-in-out infinite;}
@keyframes prTwinkle{0%,100%{opacity:.35}50%{opacity:.9}}
.pr-empty{padding:40px 10px;color:var(--muted);text-align:center;position:relative;}
.pr-ring-wrap{position:relative;width:min(300px,74vw);aspect-ratio:1;flex:none;}
.pr-ring{width:100%;height:100%;overflow:visible;}
.pr-track{fill:none;stroke:rgba(245,242,237,.12);stroke-width:5;}
.pr-prog{fill:none;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow));transition:stroke-dashoffset 1s linear;}
.pr-dot{fill:#f5f2ed;filter:drop-shadow(0 0 8px var(--glow));}
.pr-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.pr-lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.pr-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,9vw,46px);line-height:1.1;margin:4px 0 2px;}
.pr-count{font-variant-numeric:tabular-nums;font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:.02em;}
.pr-at{font-size:12px;color:var(--muted);margin-top:4px;}
.pr-side{position:relative;flex:1 1 260px;max-width:380px;min-width:240px;}
.pr-phase{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;}
.pr-phase-dot{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);}
.pr-list{display:flex;flex-direction:column;gap:6px;}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-radius:14px;background:rgba(245,242,237,.04);border:1px solid transparent;font-size:14px;color:var(--muted);transition:all .4s var(--ease);}
.pr-row b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;}
.pr-row.next{background:rgba(245,242,237,.1);border-color:var(--glow);color:var(--ink);box-shadow:0 0 24px -8px var(--glow);}
.pr-row.done{opacity:.45}

@media (max-width:640px){.pr-card{padding:26px 18px}.pr-side{max-width:none;width:100%}}

  border:1px solid var(--line);border-radius:999px 999px 24px 24px / 120px 120px 24px 24px;background:var(--card);}
.ay-card::before{content:'';position:absolute;inset:0 0 auto 0;height:140px;background:radial-gradient(120% 100% at 50% 0,var(--gold-dim),transparent 70%);opacity:.55;pointer-events:none;}

.hf-ar.blur{filter:blur(9px);user-select:none}

/* ---------- qur'an word / topic search ---------- */
.as-wrap{margin:0 0 22px;padding:22px clamp(16px,3vw,28px);border:1px solid var(--line);border-radius:22px;background:var(--card)}
.as-note{margin:14px 2px 10px;font-size:12.5px;color:var(--muted)}
.as-list{display:grid;gap:10px;max-height:560px;overflow:auto;padding-right:2px}
.as-item{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(245,242,237,.03);display:flex;flex-direction:column;gap:8px}
.as-item header{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.as-item header b{color:#ff8a94;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.as-ar{font-family:var(--arabic-font);font-size:24px;line-height:2;margin:0}
.as-en{margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:18px;line-height:1.5;color:#e8e2da}
.as-en mark{background:rgba(var(--gold-rgb),.35);color:#fff;border-radius:4px;padding:0 3px}
.as-item footer{display:flex;gap:8px}.as-item footer .btn{padding:8px 14px;font-size:12.5px}

/* ---------- seerah ---------- */
.yt-part{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--emerald-hi),var(--gold));color:var(--gold-hi);z-index:2;}
.sr-hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px 24px;padding:22px 24px;margin-bottom:22px;
  background:var(--card);border:1px solid var(--line);border-radius:28px 28px 18px 18px;position:relative;overflow:hidden;}
.sr-hero::before{content:'';position:absolute;inset:0 0 auto 0;height:80px;background:radial-gradient(120% 100% at 50% 0,var(--gold-dim),transparent 70%);opacity:.45;pointer-events:none;}
.sr-ar{position:relative;font-family:'Amiri','Noto Naskh Arabic',serif;font-size:30px;color:var(--danger);}
.sr-prog{position:relative;flex:1 1 220px;min-width:180px;}
.sr-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;}
.sr-bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--emerald-hi),var(--gold));transition:width .6s var(--ease);}
.sr-count{margin-top:8px;font-size:12px;color:var(--muted);}
.sr-hero .btn{position:relative;}

/* ---------- videos / YouTube ---------- */
.yt-channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px;}
.yt-channel{
  position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;text-decoration:none;
  background:var(--card);border:1px solid var(--line);border-radius:26px 26px 18px 18px;overflow:hidden;
  transition:transform .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease);
}
.yt-channel::before{content:'';position:absolute;inset:0 0 auto 0;height:70px;background:radial-gradient(120% 100% at 50% 0,var(--gold-dim),transparent 70%);opacity:.5;pointer-events:none;}
.yt-channel:hover{transform:translateY(-3px);border-color:var(--gold-dim);background:var(--card-hi);}
.yt-avatar{position:relative;flex:none;width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:var(--gold-hi);
  background:linear-gradient(135deg,var(--emerald-hi),var(--emerald));border:1px solid var(--gold-dim);}
.yt-avatar img{width:100%;height:100%;object-fit:cover;}
.yt-ch-text{position:relative;display:flex;flex-direction:column;min-width:0;}
.yt-ch-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:23px;line-height:1.1;}
.yt-ch-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;}
.yt-sub{position:relative;margin-left:auto;flex:none;font-size:12px;font-weight:700;color:#f5f2ed;padding:9px 16px;border-radius:999px;
  background:linear-gradient(135deg,#a3111f,var(--emerald-hi));}

.yt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:26px;}
.yt-stat{background:var(--bg-soft);padding:16px 10px;text-align:center;}
.yt-stat b{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;color:var(--gold-hi);}
.yt-stat span{font-size:11px;color:var(--muted);letter-spacing:.03em;}

.yt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;}
.yt-chips{display:flex;flex-wrap:wrap;gap:8px;}
.yt-chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .25s var(--ease);}
.yt-chip:hover{color:var(--ink);border-color:var(--gold-dim);}
.yt-chip.on{background:var(--gold-dim);border-color:var(--gold);color:var(--gold-hi);}
.yt-search,.yt-select{background:var(--card);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:13px;padding:10px 14px;border-radius:999px;outline:none;transition:border-color .25s var(--ease);}
.yt-search{flex:1;min-width:150px;}
.yt-select{color-scheme:dark;cursor:pointer;}
.yt-search:focus,.yt-select:focus{border-color:var(--gold);}

.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.yt-card{
  display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;color:inherit;font:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:22px 22px 16px 16px;overflow:hidden;
  transition:opacity .8s var(--ease),transform .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease),box-shadow .35s var(--ease);
}
.yt-card.in:hover{transform:translateY(-5px);border-color:var(--gold-dim);background:var(--card-hi);box-shadow:0 22px 44px -26px rgba(0,0,0,.8);}
.yt-thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--bg-raised);overflow:hidden;}
.yt-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease);}
.yt-card:hover .yt-thumb img{transform:scale(1.06);}
.yt-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(var(--bg-rgb),.7),transparent 55%);pointer-events:none;}
.yt-play{position:absolute;inset:0;z-index:2;display:grid;place-items:center;}
.yt-play span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;padding-left:3px;color:#f5f2ed;
  background:linear-gradient(135deg,#a3111f,var(--emerald-hi));box-shadow:0 10px 30px -8px rgba(0,0,0,.7);opacity:.92;transform:scale(.9);transition:transform .35s var(--ease),opacity .35s var(--ease);}
.yt-card:hover .yt-play span{transform:scale(1.08);opacity:1;}
.yt-dur,.yt-tag,.yt-new{position:absolute;z-index:2;font-size:11px;font-weight:700;border-radius:8px;padding:4px 8px;letter-spacing:.02em;}
.yt-dur{right:10px;bottom:10px;background:rgba(var(--bg-rgb),.82);color:var(--ink);}
.yt-tag{left:10px;bottom:10px;background:rgba(var(--bg-rgb),.82);color:var(--gold-hi);border:1px solid var(--gold-dim);}
.yt-new{left:10px;top:10px;background:var(--gold);color:#f5f2ed;}
.yt-body{display:flex;flex-direction:column;gap:9px;padding:14px 16px 16px;}
.yt-title{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em;}
.yt-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.yt-views{display:inline-flex;align-items:center;gap:5px;color:var(--gold-hi);font-weight:600;}
.yt-dot{opacity:.5;}

.yt-skel{border:1px solid var(--line);border-radius:22px 22px 16px 16px;overflow:hidden;background:var(--card);padding-bottom:16px;}
.yt-skel span{display:block;aspect-ratio:16/9;}
.yt-skel i{display:block;height:12px;margin:14px 16px 0;border-radius:6px;width:80%;}
.yt-skel i+i{width:45%;}
.yt-skel span,.yt-skel i{background:linear-gradient(90deg,var(--card) 0%,var(--card-hi) 50%,var(--card) 100%);background-size:200% 100%;animation:ytShimmer 1.4s linear infinite;}
@keyframes ytShimmer{to{background-position:-200% 0;}}

.yt-empty{text-align:center;color:var(--muted);padding:40px 0;}
.yt-empty p{margin:0 0 16px;}
.yt-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:30px;font-size:12px;color:var(--muted-2);text-align:center;flex-wrap:wrap;}
.yt-live{width:7px;height:7px;border-radius:50%;background:#4fbf8f;box-shadow:0 0 0 0 rgba(79,191,143,.6);animation:ytPulse 2s infinite;}
.yt-live.off{background:var(--muted-2);animation:none;}
@keyframes ytPulse{70%{box-shadow:0 0 0 7px rgba(79,191,143,0);}100%{box-shadow:0 0 0 0 rgba(79,191,143,0);}}

.yt-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(5,6,7,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:pageIn .3s var(--ease);overflow-y:auto;}
.yt-modal-box{width:min(960px,100%);}
.yt-frame{aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--gold-dim);box-shadow:0 30px 80px -20px rgba(0,0,0,.9);}
.yt-frame iframe{width:100%;height:100%;border:0;display:block;}
.yt-modal-info{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:16px;}
.yt-modal-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;line-height:1.25;}
.yt-modal-meta{font-size:12.5px;color:var(--muted);margin-top:6px;}
.yt-modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
.yt-modal-actions .btn{padding:11px 20px;font-size:13px;text-decoration:none;}


.yt-saved{position:absolute;z-index:2;right:10px;top:10px;font-size:11px;font-weight:700;border-radius:8px;padding:4px 8px;background:var(--emerald-hi);color:var(--ink);}
.yt-frame video{width:100%;height:100%;display:block;background:#000;}
.yt-audio{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--bg-soft);border:1px solid var(--gold-dim);}
.yt-audio img{width:min(320px,70%);aspect-ratio:16/9;object-fit:cover;border-radius:16px;}
.yt-audio audio{width:100%;color-scheme:dark;}
.yt-dl-note{margin-top:8px;font-size:12.5px;color:var(--danger);}
.yt-modal-actions .btn[disabled]{opacity:.7;cursor:progress;}
.yt-card{cursor:pointer;}
.yt-dlbtn{position:absolute;z-index:3;right:10px;top:10px;min-width:36px;height:36px;padding:0 8px;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  background:rgba(var(--bg-rgb),.82);color:var(--gold-hi);border:1px solid var(--gold-dim);font-size:11px;transition:transform .25s var(--ease),background .25s var(--ease);}
.yt-dlbtn:hover{transform:scale(1.08);background:rgba(var(--bg-rgb),.95);}
.yt-dlbtn.done{background:var(--emerald-hi);color:var(--ink);border-color:transparent;}
.yt-hint{position:absolute;z-index:3;right:10px;top:54px;max-width:70%;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:10px;background:rgba(var(--bg-rgb),.92);color:var(--ink);border:1px solid var(--line);}
.yt-ctl{position:relative;display:flex;align-items:center;gap:10px;margin-top:14px;padding:8px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--gold-dim);}
.yt-cb{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--gold-hi);display:grid;place-items:center;cursor:pointer;transition:background .2s var(--ease);}
.yt-cb:hover{background:var(--gold-dim);}
.yt-time{flex:none;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.yt-seek,.yt-vol{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;outline:none;cursor:pointer;margin:0;background:linear-gradient(to right,var(--gold) var(--p,0%),var(--line) var(--p,0%));}
.yt-seek{flex:1;min-width:60px;}.yt-vol{flex:none;width:72px;}
.yt-seek::-webkit-slider-thumb,.yt-vol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold-hi);border:0;}
.yt-seek::-moz-range-thumb,.yt-vol::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold-hi);border:0;}
.yt-seek::-moz-range-track,.yt-vol::-moz-range-track{background:transparent;}
.yt-more{position:relative;flex:none;}
.yt-scrim{position:fixed;inset:0;z-index:5;}
.yt-menu{position:absolute;right:0;bottom:calc(100% + 10px);z-index:6;min-width:230px;padding:6px;border-radius:16px;background:var(--bg-raised);border:1px solid var(--gold-dim);box-shadow:0 20px 50px -10px rgba(0,0,0,.9);}
.yt-menu button,.yt-menu a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none;}
.yt-menu button:hover,.yt-menu a:hover{background:var(--card-hi);}
.yt-menu em{margin-left:auto;font-style:normal;color:var(--muted);}
.yt-menu .back{color:var(--gold-hi);font-weight:600;}
.yt-menu button[disabled]{opacity:.6;cursor:progress;}
.yt-menu .ck{margin-left:auto;display:grid;color:var(--gold-hi);}
@media(max-width:560px){.yt-vol{display:none;}.yt-ctl{gap:6px;padding:6px 8px;}}
@media(max-width:560px){
  .yt-sub{display:none;}
  .yt-grid{grid-template-columns:1fr;}
  .yt-search{flex-basis:100%;order:3;}
}
@media(prefers-reduced-motion:reduce){
  .yt-live,.yt-skel span,.yt-skel i{animation:none;}
}
</style>
