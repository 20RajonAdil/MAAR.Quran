<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline — Quran Maar</title>
<meta name="theme-color" content="#0a0b0d">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#0a0b0d;--ink:#f4efe4;--muted:#9b9587;--gold:#c6a15b;--line:rgba(244,239,228,.1);}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
  .wrap{max-width:420px}
  img{width:72px;height:72px;margin:0 auto 22px;opacity:.9;border-radius:16px}
  h1{font-size:24px;margin:0 0 12px;font-weight:700}
  p{color:var(--muted);line-height:1.7;font-size:15px;margin:0 0 24px}
  a{display:inline-block;border:1px solid var(--gold);color:var(--gold);text-decoration:none;
    border-radius:999px;padding:11px 26px;font-weight:600;font-size:14px}
  a:hover{background:rgba(198,161,91,.12)}
</style>
</head>
<body>
  <div class="wrap">
    <img src="icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Quran Maar couldn't load its main screen from this device's cache. Open the app once while connected and it will stay available offline from then on — including any recitations you've downloaded.</p>
    <a href="./">Try again</a>
  </div>
</body>
</html>
